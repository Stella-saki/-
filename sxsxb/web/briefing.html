<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>实训室宣讲回顾 · 实训室选报系统</title>
<style>
  :root{
    --bg:#f3f6fb; --surface:#ffffff; --ink:#17233d; --ink-2:#4b5b78; --ink-3:#7b8aa6;
    --line:#dfe6f1; --brand:#1d4ed8; --brand-2:#0f766e; --accent:#ea580c;
    --radius:18px; --shadow:0 18px 40px rgba(23,35,61,.10);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:
      radial-gradient(50% 40% at 8% 6%, rgba(29,78,216,.10), transparent 70%),
      radial-gradient(45% 40% at 92% 88%, rgba(15,118,110,.10), transparent 70%),
      var(--bg);
    color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif;
    overflow:hidden;
  }
  .deck{position:fixed;inset:0;display:flex;flex-direction:column}
  .slides{position:relative;flex:1;overflow:hidden}
  .slide{
    position:absolute;inset:0;display:none;flex-direction:column;
    padding:64px 88px 96px;
  }
  .slide.active{display:flex;animation:fadeUp .45s ease both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .kicker{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--brand);font-weight:700;margin:0 0 14px}
  h1{font-size:76px;line-height:1.08;margin:0;letter-spacing:-.02em}
  h2{font-size:44px;line-height:1.15;margin:0}
  h3{font-size:18px;margin:0 0 10px}
  p{margin:0}
  .lede{font-size:22px;line-height:1.7;color:var(--ink-2)}
  .muted{color:var(--ink-3);font-size:14px}

  /* 封面 */
  .cover{align-items:center;justify-content:center;text-align:center}
  .cover .bar{width:74px;height:6px;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand-2));margin:26px auto}
  .cover .meta{margin-top:34px;color:var(--ink-3);font-size:15px;letter-spacing:.06em}

  /* 总览 */
  .overview-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:34px}
  .ov-card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:24px 26px;box-shadow:var(--shadow);position:relative;overflow:hidden;
  }
  .ov-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(180deg,var(--brand),var(--brand-2))}
  .ov-card .code{font-size:12px;letter-spacing:.18em;color:var(--ink-3);font-weight:700}
  .ov-card h3{font-size:26px;margin:6px 0 4px}
  .ov-card .dir{color:var(--brand-2);font-size:14.5px;font-weight:600;margin-bottom:14px}
  .ov-card .nums{display:flex;gap:26px;align-items:flex-end}
  .ov-card .nums b{font-size:34px;line-height:1;font-weight:800}
  .ov-card .nums span{display:block;font-size:12px;color:var(--ink-3);margin-top:4px;letter-spacing:.08em}

  /* 单个实训室 */
  .lab-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;border-bottom:1px solid var(--line);padding-bottom:22px}
  .lab-head .code{font-size:12px;letter-spacing:.2em;color:var(--ink-3);font-weight:700}
  .lab-head h2{margin-top:4px}
  .lab-head .dir{color:var(--brand-2);font-size:16px;font-weight:600;margin-top:8px}
  .quota{display:flex;align-items:baseline;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 22px;box-shadow:var(--shadow)}
  .quota b{font-size:42px;line-height:1;color:var(--brand)}
  .quota .cap{font-size:13px;color:var(--ink-2)}
  .quota .rest{font-size:13px;color:var(--brand-2);font-weight:700}

  .lab-body{flex:1;display:grid;grid-template-columns:1.05fr 1.2fr;gap:34px;padding-top:26px;min-height:0}
  .intro-block{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px 28px;box-shadow:var(--shadow);display:flex;flex-direction:column}
  .intro-block h3{color:var(--brand);font-size:13px;letter-spacing:.16em;text-transform:uppercase}
  .intro-block p{font-size:16.5px;line-height:1.95;color:var(--ink-2)}
  .facts{margin-top:auto;display:flex;flex-wrap:wrap;gap:10px;padding-top:20px}
  .fact{font-size:12.5px;color:var(--ink-2);background:#eef3fb;border-radius:99px;padding:6px 12px}

  .mentor-col{display:flex;flex-direction:column;min-height:0}
  .mentor-col h3{color:var(--brand);font-size:13px;letter-spacing:.16em;text-transform:uppercase}
  .mentor-list{display:grid;gap:12px;overflow:auto;padding-right:4px}
  .mentor{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 18px;box-shadow:0 8px 20px rgba(23,35,61,.06)}
  .mhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .mhead b{font-size:18px}
  .mhead .title{font-size:12.5px;color:var(--ink-3)}
  .mhead .cap{margin-left:auto;font-size:12px;color:var(--brand);background:#eef3fb;border-radius:99px;padding:3px 10px}
  .mentor .dir{font-size:13.5px;color:var(--brand-2);font-weight:600;margin:6px 0 4px}
  .mentor .intro{font-size:13px;line-height:1.7;color:var(--ink-2)}

  /* 结束页 */
  .flow{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:40px}
  .step{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
  .step .n{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;margin-bottom:14px}
  .step b{display:block;font-size:17px;margin-bottom:6px}
  .step span{font-size:13px;line-height:1.65;color:var(--ink-2)}
  .end-note{margin-top:46px;font-size:20px;color:var(--ink-2);text-align:center}

  /* 控件 */
  .topbar{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:16px;padding:18px 30px;font-size:12.5px;color:var(--ink-3);z-index:5}
  .topbar .brand{font-weight:700;letter-spacing:.08em;color:var(--ink-2)}
  .topbar .spacer{flex:1}
  .topbar button{border:1px solid var(--line);background:rgba(255,255,255,.8);color:var(--ink-2);border-radius:10px;padding:6px 12px;font-size:12.5px;cursor:pointer}
  .progress{height:4px;background:#e4eaf4;border-radius:99px;width:180px;overflow:hidden}
  .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--brand-2));transition:width .3s}
  .controls{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:18px;padding:18px;z-index:5}
  .controls button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:20px;cursor:pointer;box-shadow:0 8px 20px rgba(23,35,61,.10)}
  .controls button:disabled{opacity:.35;cursor:default}
  .dots{display:flex;gap:8px}
  .dots i{width:8px;height:8px;border-radius:50%;background:#c9d4e6;cursor:pointer;transition:.2s}
  .dots i.on{background:var(--brand);width:22px;border-radius:99px}
  .counter{position:fixed;right:30px;bottom:26px;font-size:12px;color:var(--ink-3);letter-spacing:.1em}
  .state{display:flex;align-items:center;justify-content:center;height:100%;color:var(--ink-3);font-size:16px}
</style>
</head>
<body>
<div class="deck">
  <div class="topbar">
    <span class="brand">实训室选报系统 · 宣讲回顾</span>
    <span class="spacer"></span>
    <div class="progress"><i id="progressBar"></i></div>
    <button id="fsBtn" type="button">全屏</button>
    <button id="backBtn" type="button">返回系统</button>
  </div>
  <div class="slides" id="slides"><div class="state">加载中…</div></div>
  <div class="controls">
    <button id="prevBtn" type="button" aria-label="上一页">←</button>
    <div class="dots" id="dots"></div>
    <button id="nextBtn" type="button" aria-label="下一页">→</button>
  </div>
  <div class="counter" id="counter"></div>
</div>
<script>
const slidesEl = document.getElementById('slides');
const dotsEl = document.getElementById('dots');
const counterEl = document.getElementById('counter');
const progressBar = document.getElementById('progressBar');
let index = 0;
let total = 0;

function esc(v){
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function go(i){
  if (i < 0 || i >= total) return;
  index = i;
  document.querySelectorAll('.slide').forEach((s, k) => s.classList.toggle('active', k === i));
  dotsEl.querySelectorAll('i').forEach((d, k) => d.classList.toggle('on', k === i));
  document.getElementById('prevBtn').disabled = i === 0;
  document.getElementById('nextBtn').disabled = i === total - 1;
  counterEl.textContent = (i + 1) + ' / ' + total;
  progressBar.style.width = ((i + 1) / total * 100) + '%';
}

function render(labs){
  const quotas = labs.reduce((sum, l) => sum + Number(l.quota || 0), 0);
  const remains = labs.reduce((sum, l) => sum + Number(l.remaining || 0), 0);
  const mentorCount = labs.reduce((sum, l) => sum + (l.mentors || []).length, 0);
  const html = [];

  html.push(`
    <section class="slide active cover">
      <p class="kicker">Briefing Review · 2026</p>
      <h1>实训室宣讲回顾</h1>
      <div class="bar"></div>
      <p class="lede">实训室方向、导师团队与项目方向、各室需求人数</p>
      <p class="meta">信息工程学院 · 实训室选报系统</p>
    </section>`);

  html.push(`
    <section class="slide">
      <p class="kicker">Overview · 总览</p>
      <h2>四个实训室，${quotas} 个名额</h2>
      <div class="overview-grid">
        ${labs.map(l => `
          <div class="ov-card">
            <div class="code">${esc(l.lab_code)}</div>
            <h3>${esc(l.name)}</h3>
            <div class="dir">${esc(l.direction || '—')}</div>
            <div class="nums">
              <div><b>${esc(l.quota)}</b><span>需求人数</span></div>
              <div><b>${esc(l.remaining)}</b><span>剩余名额</span></div>
              <div><b>${(l.mentors || []).length}</b><span>导师人数</span></div>
            </div>
          </div>`).join('')}
      </div>
      <p class="muted" style="margin-top:18px">合计导师 ${mentorCount} 位，当前剩余 ${remains} 个名额。</p>
    </section>`);

  labs.forEach(l => {
    html.push(`
      <section class="slide">
        <div class="lab-head">
          <div>
            <div class="code">${esc(l.lab_code)}</div>
            <h2>${esc(l.name)}</h2>
            <div class="dir">${esc(l.direction || '—')}</div>
          </div>
          <div class="quota">
            <b>${esc(l.quota)}</b>
            <div>
              <div class="cap">需求人数</div>
              <div class="rest">剩余 ${esc(l.remaining)} 人</div>
            </div>
          </div>
        </div>
        <div class="lab-body">
          <div class="intro-block">
            <h3>实训室简介</h3>
            <p>${esc(l.intro || '暂无简介')}</p>
            <div class="facts">
              <span class="fact">需求 ${esc(l.quota)} 人</span>
              <span class="fact">剩余 ${esc(l.remaining)} 人</span>
              <span class="fact">导师 ${(l.mentors || []).length} 位</span>
            </div>
          </div>
          <div class="mentor-col">
            <h3>导师与项目方向</h3>
            <div class="mentor-list">
              ${(l.mentors || []).map(m => `
                <div class="mentor">
                  <div class="mhead">
                    <b>${esc(m.name)}</b>
                    <span class="title">${esc(m.title || '')}</span>
                    <span class="cap">名额 ${esc(m.capacity == null ? '—' : m.capacity)}</span>
                  </div>
                  <div class="dir">${esc(m.research_direction || '—')}</div>
                  <p class="intro">${esc(m.intro || '暂无简介')}</p>
                </div>`).join('')}
            </div>
          </div>
        </div>
      </section>`);
  });

  html.push(`
    <section class="slide">
      <p class="kicker">Next · 选报流程</p>
      <h2>看完宣讲，下一步怎么走</h2>
      <div class="flow">
        <div class="step"><div class="n">1</div><b>了解方向</b><span>对照实训室简介与导师项目方向，确定 3 个平行志愿。</span></div>
        <div class="step"><div class="n">2</div><b>意向填报</b><span>在系统开放时间内提交志愿，并表达室内/跨室调剂意愿。</span></div>
        <div class="step"><div class="n">3</div><b>参加面试</b><span>按场次参加面试，面试成绩与导师评价共同决定拟录取。</span></div>
        <div class="step"><div class="n">4</div><b>确认录取</b><span>收到拟录取后及时确认，超时未确认名额将自动释放。</span></div>
      </div>
      <p class="end-note">欢迎选择心仪的实训室与导师</p>
    </section>`);

  slidesEl.innerHTML = html.join('');
  total = document.querySelectorAll('.slide').length;
  dotsEl.innerHTML = Array.from({length: total}, (_, i) => `<i data-i="${i}"></i>`).join('');
  dotsEl.querySelectorAll('i').forEach(d => d.addEventListener('click', () => go(Number(d.dataset.i))));
  go(0);
}

async function load(){
  const token = localStorage.getItem('sxsxb_token');
  if (!token) { location.href = 'index.html'; return; }
  try {
    const resp = await fetch('/api/labs/profiles', { headers: { 'Accept': 'application/json', 'Authorization': 'Bearer ' + token } });
    if (resp.status === 401) { localStorage.removeItem('sxsxb_token'); localStorage.removeItem('sxsxb_user'); location.href = 'index.html'; return; }
    const data = await resp.json();
    render(data.items || []);
  } catch (e) {
    slidesEl.innerHTML = '<div class="state">加载失败，请返回系统后重试</div>';
  }
}

document.getElementById('prevBtn').addEventListener('click', () => go(index - 1));
document.getElementById('nextBtn').addEventListener('click', () => go(index + 1));
document.getElementById('backBtn').addEventListener('click', () => {
  if (document.referrer) history.back(); else location.href = 'teacher.html';
});
document.getElementById('fsBtn').addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen();
});
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') { e.preventDefault(); go(index + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); go(index - 1); }
  if (e.key === 'f' || e.key === 'F') document.getElementById('fsBtn').click();
});
load();
</script>
</body>
</html>
